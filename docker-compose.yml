version: "3.9"

# BuildSync-3D local stack.
#
# Notes:
# - The OpenCV pipeline is a one-shot subprocess invoked by the backend,
#   not a long-running service, so there is no `opencv-service` container.
#   The backend image needs python3 + opencv-python installed; build it
#   from a Dockerfile that pip-installs ../opencv-service/requirements.txt.
# - The frontend container is a dev convenience; in production it's
#   typically served as static files behind a CDN.

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: buildsync
      MYSQL_USER: buildsync
      MYSQL_PASSWORD: buildsync
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PORT: "4000"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: buildsync
      DB_PASSWORD: buildsync
      DB_NAME: buildsync
      JWT_SECRET: change-me
      PYTHON_BIN: python3
      OPENCV_SERVICE_DIR: /opencv-service
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - ./opencv-service:/opencv-service:ro
      - backend_uploads:/app/src/uploads

  frontend:
    image: oven/bun:1
    working_dir: /app
    command: sh -c "bun install && bun run dev --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:4000/api
      VITE_USE_MOCK: "false"
    volumes:
      - ./:/app
      - /app/node_modules

volumes:
  mysql_data:
  backend_uploads:
